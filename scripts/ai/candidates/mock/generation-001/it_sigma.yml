title: Suspicious Network-Hosted PowerShell Execution
status: experimental
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_network:
    CommandLine|contains: '\\'
  condition: selection_image and selection_network
falsepositives:
  - Approved administrative scripts executed from network shares
level: medium
